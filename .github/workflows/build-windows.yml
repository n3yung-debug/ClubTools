name: Build Windows app

on:
  push:
    branches: [main, claude/tender-gates-cgrdaw]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install pywebview==6.2.1 pyinstaller==6.22.3

      - name: Rule tests
        run: python test_engine.py

      - name: Build ChemBuilder.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ChemBuilder --icon icon.ico
          --add-data "ui.html;." --add-data "cards.json;." --collect-all webview chem_builder.py

      - name: Self-test the exe (server, page, card data)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ChemBuilder.exe -ArgumentList "--selftest","--port","8790" -Wait -PassThru
          $log = Get-Content "$env:APPDATA\ChemBuilder\chem_builder.log" -Raw
          Write-Output $log
          if ($p.ExitCode -ne 0 -or $log -notmatch "SELFTEST OK") { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Window smoke test (opens the app window, checks the pitch renders, closes)
        shell: pwsh
        continue-on-error: true   # build machines may lack a desktop/WebView2; the self-test above is the gate
        run: |
          $p = Start-Process -FilePath dist\ChemBuilder.exe -ArgumentList "--smoke","--port","8791" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "window did not close within 90 s" }
          Get-Content "$env:APPDATA\ChemBuilder\chem_builder.log" -Raw
          $r = Get-Content "$env:APPDATA\ChemBuilder\smoke.txt" -ErrorAction SilentlyContinue
          if ($r -ne "ok") { throw "smoke test result: $r" }

      - uses: actions/upload-artifact@v4
        with:
          name: ChemBuilder-windows
          path: dist/ChemBuilder.exe
          retention-days: 30
